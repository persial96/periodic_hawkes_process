[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmhp"
version = "0.1.0"
description = "Periodic multivariate Hawkes process models with seasonal baselines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Your Name" },
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "cmdstanpy>=1.2",
]

[project.optional-dependencies]
paper = [
    "geopandas",
    "cartopy",
    "matplotlib",
]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pmhp = ["models/*.stan"]
